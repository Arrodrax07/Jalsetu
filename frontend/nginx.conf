server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  # Compress text assets (the app's JS/CSS and the landing film's JSON compress 3-5x)
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css text/csv application/javascript application/json application/manifest+json image/svg+xml;

  # Browser security headers. (A location with its own add_header does not inherit these, so the ones that need
  # them repeat the include below.) HSTS belongs on the TLS terminator in front of this container.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # the driver app needs GPS, the voice input needs the microphone, proof-of-delivery photos use the camera
  add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self), payment=()" always;

  # API + WebSocket
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # Service worker and manifest must never be cached long, or clients keep an old app.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # SPA routes (/, /report, /water, /track)
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Landing film data and the shipped tile pack: stable between releases
  location /landing/ {
    expires 1d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
  }
}
