name: CI
on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements.txt" }
      - name: Cache trained models + embedding model
        uses: actions/cache@v4
        with:
          path: |
            ml/artifacts
            ml/data/raw
          key: ml-${{ hashFiles('ml/jalsetu_ml/**') }}
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Train models (skipped when cached)
        working-directory: ml
        run: test -f artifacts/complaint_classifier.joblib && test -f artifacts/demand_forecaster.joblib || python -m jalsetu_ml.train all
      - run: python -m pytest tests -q
        working-directory: ml
      - run: python -m pytest tests -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run build && npm run lint
        working-directory: frontend
