[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jalsetu-ml"
version = "1.0.0"
description = "JalSetu machine-learning pipelines: complaint triage NLP and weather-driven water-demand forecasting"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "fastembed>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jalsetu-train = "jalsetu_ml.train:main"

[tool.setuptools.packages.find]
include = ["jalsetu_ml*"]
